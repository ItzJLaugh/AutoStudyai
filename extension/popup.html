<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CordiaClassroom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brand-bar">
    <img src="icon48.png" alt="">
    <div><strong>CordiaClassroom</strong><span>Turn this into something you can learn.</span></div>
  </header>

  <section id="auth-section" class="surface auth-surface">
    <div id="auth-status"></div>
    <div id="auth-login" style="display:none">
      <a href="https://classroom.cordiacode.com" target="_blank" id="auth-login-btn" class="primary wide">Open CordiaClassroom</a>
      <p>Sign in there, then reopen this extension.</p>
    </div>
    <div id="auth-logged-in" style="display:none">
      <span id="auth-user-email"></span>
      <button id="auth-logout-btn" class="quiet">Disconnect</button>
    </div>
  </section>

  <button id="capture-btn" class="primary capture">Capture study material <span aria-hidden="true">&#8593;</span></button>

  <div id="progress-log" style="display:none"></div>
  <div id="status" role="status"></div>

  <section id="capture-review" class="surface" style="display:none">
    <div id="capture-source"></div>
    <div id="excluded-summary"></div>
    <div id="section-list"></div>
    <button id="generate-selected-btn" class="primary wide" disabled>Build study guide</button>
  </section>

  <button id="save-guide-btn" class="secondary wide" style="display:none">Save to classroom</button>
  <div id="platform-banner" style="display:none">
    Open your guide in <a href="https://classroom.cordiacode.com" target="_blank">CordiaClassroom</a>
  </div>

  <nav class="tabs" aria-label="Study materials">
    <button class="tab-btn active" data-tab="notes">Notes</button>
    <button class="tab-btn" data-tab="guide">Guide</button>
    <button class="tab-btn" data-tab="flashcards">Cards</button>
    <button class="tab-btn" data-tab="chat">Tutor</button>
  </nav>
  <main id="tab-content">
    <div id="notes-section" class="tab-section active"></div>
    <div id="guide-section" class="tab-section"></div>
    <div id="flashcards-section" class="tab-section"></div>
    <div id="chat-section" class="tab-section">
      <div id="chat-history"></div>
      <div class="chat-compose">
        <input id="chat-input" type="text" placeholder="Ask about this material">
        <button id="chat-send-btn" class="primary">Ask</button>
        <button id="chat-example-btn" class="quiet">Example</button>
      </div>
      <div id="chat-answer"></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
