<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CordiaClassroom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brand">
    <img src="icon48.png" alt="">
    <div><strong>CordiaClassroom</strong><span>Turn the current page into a study guide.</span></div>
  </header>

  <section class="card auth">
    <div id="signed-out" hidden>
      <p>Sign in to CordiaClassroom first.</p>
      <a class="button primary" href="https://classroom.cordiacode.com" target="_blank">Open CordiaClassroom</a>
    </div>
    <div id="signed-in" hidden><span id="user-email"></span><button id="disconnect" class="link">Disconnect</button></div>
  </section>

  <section class="card context">
    <span>Current tab</span>
    <strong id="page-title">Open a study page</strong>
    <small id="page-url"></small>
  </section>

  <main class="card actions" aria-label="Study actions">
    <button id="capture-screen" class="action"><b>1</b><span><strong>Capture screen</strong><small>Capture exactly what is visible.</small></span></button>
    <button id="scrape-page" class="action"><b>2</b><span><strong>Scrape page</strong><small>Read the page, Canvas file, or PDF.</small></span></button>
    <button id="extract-content" class="action"><b>3</b><span><strong>Get educational content</strong><small>Keep the material worth studying.</small></span></button>
    <button id="make-guide" class="action primary"><b>4</b><span><strong>Make &amp; save study guide</strong><small>Generate it and confirm it is in Classroom.</small></span></button>
  </main>

  <p id="status" role="status">Choose an action.</p>
  <section id="result" class="card result" hidden>
    <strong id="result-title"></strong>
    <pre id="result-content"></pre>
    <a id="open-classroom" href="https://classroom.cordiacode.com/dashboard?view=guides" target="_blank" hidden>Open saved guide</a>
  </section>
  <script src="popup.js"></script>
</body>
</html>
